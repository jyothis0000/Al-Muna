<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 -1792.834 2175.668 2175.668" role="img" aria-label="Arshawn Arbabi">
  <!--
    Favicon. Generated FROM public/brand/mark.svg, which stays the canonical mark;
    the two <path> elements below are copied from it verbatim and must not be
    hand-edited. If the mark changes, regenerate rather than patch.

    Two things differ from the source, and both are deliberate.

    1. THE VIEWBOX IS SQUARE AND TIGHT. The mark's real bounding box, measured
       with getBBox() in a browser rather than read off the source viewBox, is
       x 40 to 2215.668, y -1440 to 30, so 2175.668 x 1470 in viewBox space
       after the g's scale(1,-1). A favicon slot is square, and the mark is
       wider than it is tall, so the largest it can be drawn is width-filling:
       side = 2175.668, centred on the mark's own y-centre of -705, giving
       y = -705 - 2175.668/2 = -1792.834. Zero padding, edge to edge on the
       wide axis. That is the maximum, not a choice with room left in it.

    2. fill="currentColor" IS GONE. In a favicon there is no inheriting
       document, so currentColor has nothing to resolve against, and the same
       attribute already rasterised to zero opaque pixels when this mark was
       used as a mask. The fill is set in CSS instead, which is also what makes
       the theme switch possible at all: prefers-color-scheme inside an SVG
       favicon reads the OS/browser setting, so the tab icon follows the user's
       theme rather than the page's.

    Colours are the site's own ink, not #000/#fff: the `neutral-12` custom
    property in design-tokens/tokens.css, light ramp line 26 and dark ramp
    line 220. It is named there without its leading double hyphen on purpose,
    because a double hyphen is illegal inside an XML comment and makes the
    whole file fail to parse. Keep the two values in sync by hand, since a
    standalone favicon document cannot reference the token layer.

    If the <style> block is ignored by some renderer, fill defaults to black,
    which is the light-theme value. That degradation is correct, not accidental.
  -->
  <style>
    /* Hex first, oklch second, on purpose. An unsupported colour function is
       dropped as an invalid declaration rather than failing the rule, so on a
       browser without oklch (pre Chrome 111, pre Safari 15.4) the hex stands.
       Without it, dark mode would fall all the way back to the initial fill of
       black and paint a black mark on dark browser chrome. The hex values are
       not eyeballed: they are the sRGB pixels those exact oklch colours
       rasterise to, sampled from a render. */
    path { fill: #1a1a1f; fill: oklch(0.22 0.0096 287); }
    @media (prefers-color-scheme: dark) {
      path { fill: #e7e7eb; fill: oklch(0.93 0.0054 287); }
    }
  </style>
